<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midnight Crossing | Coaster Designer</title>
<style>
:root{color-scheme:dark;--ink:#f7f1ff;--muted:#bdb0cf;--pink:#ff6aae;--cyan:#79e9fa;--panel:#151222;--line:#39304c}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#271630,#0c0a14 55%);color:var(--ink);font:1rem system-ui,sans-serif}
main{max-width:1180px;margin:auto;padding:clamp(16px,4vw,48px)}
header{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
h1,h2,p{margin:0}h1{font-size:clamp(2.5rem,8vw,5.3rem);line-height:.9;letter-spacing:-.075em;font-style:italic}h1 span{color:var(--pink)}
h2{font-size:1.05rem}p{color:var(--muted)}header p{margin-top:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.toolbar,.pad{padding:16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar h2{margin-right:auto}
button,select,input{font:inherit;border:1px solid #66577a;background:#211a30;color:var(--ink);border-radius:8px;padding:9px 12px}
button{cursor:pointer}button.primary{background:var(--cyan);color:#09151d;border-color:var(--cyan);font-weight:750}
button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible,canvas:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
canvas{display:block;width:100%;height:auto}#track{touch-action:none;cursor:crosshair}
.notes{display:flex;align-items:center;justify-content:space-between;gap:8px 24px;flex-wrap:wrap;padding:12px 16px}
#gaugeGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.gauge{padding:14px}.gauge strong{display:block;font-size:clamp(1.3rem,4vw,2.4rem);line-height:1.2;color:var(--cyan);font-variant-numeric:tabular-nums}
.gauge:nth-child(2) strong{color:var(--pink)}
.gauge span,.notes,.legend{font-size:.875rem}.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px}
.speed{color:var(--cyan)}.load{color:var(--pink)}.warn{color:#ffd081}
.details{margin-top:12px;display:grid;gap:12px}.details p{margin-top:6px}
@media(max-width:520px){#gaugeGrid{grid-template-columns:1fr 1fr}.gauge:last-child{grid-column:1/-1}}
</style>
</head>
<body>
<main>
<header><div><h1>Midnight <span>Crossing</span></h1><p>Shibuya · Coaster designer</p></div></header>
<section class="panel" aria-labelledby="editor">
<div class="toolbar">
<h2 id="editor">Track editor</h2>
<label for="preset">Preset</label>
<select id="preset"><option value="cruise">Crossing Cruise</option><option value="validation">Validation Valley</option><option value="rollback">Rollback</option><option value="high">Over 4 g</option><option value="low">Below −1 g</option></select>
<button id="reset">Reset track</button><button class="primary" id="ride">Start ride</button>
</div>
<canvas id="track" width="1000" height="480" tabindex="0" aria-label="Editable coaster track" aria-describedby="edit-help"></canvas>
<div class="notes"><p id="edit-help">Drag track handles. With the track focused, use 1–6 to select a handle and ↑ / ↓ to move it.</p><span id="status" role="status">Ready</span></div>
</section>
<section id="gaugeGrid" aria-label="Live ride readings">
<div class="panel gauge"><span>Speed</span><strong id="speed">0.0 mph</strong></div>
<div class="panel gauge"><span>Rider load</span><strong id="load">1.00 g</strong></div>
<div class="panel gauge"><span>Track distance</span><strong id="distance">0.0 m</strong></div>
</section>
<section class="panel pad" aria-labelledby="telemetry">
<h2 id="telemetry">Run telemetry</h2><div class="legend"><span class="speed">Speed · mph · left axis</span><span class="load">Rider load · g · right axis</span><span class="warn">Limits · −1 g and 4 g</span></div>
<canvas id="plot" width="1000" height="300" role="img" aria-label="Speed and rider load plotted by track distance"></canvas>
<p id="valley"></p>
</section>
<div class="details" id="extras"></div>
</main>
<script>
"use strict";
const byId = id => document.getElementById(id);
const track = byId("track");
const scene = track.getContext("2d");
const plot = byId("plot").getContext("2d");
const presets = {
  cruise: [44, 34, 39, 32, 37, 30],
  validation: [44, 20, 44, 32, 36, 24],
  rollback: [44, 34, 50, 32, 37, 30],
  high: [75, 5, 39, 32, 37, 30],
  low: [75, 45, 55, 5, 36, 24]
};
const g = 9.81;
const span = 60;
const subdivisions = 480;
let heights, profile, selected = 0, dragged = false;
let current, frame = 0;
const xPixel = x => 44 + 3.04 * x;
const yPixel = h => 345 - 3.9 * h;

function sample(segment, fraction) {
  const delta = heights[segment + 1] - heights[segment];
  const angle = fraction * Math.PI;
  const h = heights[segment] + delta * (1 - Math.cos(angle)) / 2;
  const slope = delta * Math.PI * Math.sin(angle) / (2 * span);
  const bend = delta * (Math.PI / span) ** 2 * Math.cos(angle) / 2;
  const speed = Math.sqrt(2 * g * Math.max(0, heights[0] - h));
  const load = 1 / Math.hypot(1, slope) + speed ** 2 * bend / (g * Math.hypot(1, slope) ** 3);
  return {x: (segment + fraction) * span, h, slope, speed, load};
}

function analyze() {
  const points = [];
  let failure;
  for (let segment = 0; segment < heights.length - 1 && !failure; segment++) {
    for (let step = 0; step <= subdivisions; step++) {
      let point = sample(segment, step / subdivisions);
      const previous = points.at(-1);
      if (previous && point.h >= heights[0] && (point.x > 0 || heights[1] >= heights[0])) {
        const delta = heights[segment + 1] - heights[segment];
        if (delta > 0 && previous.x >= segment * span) {
          const ratio = (heights[0] - heights[segment]) / delta;
          point = sample(segment, Math.acos(1 - 2 * ratio) / Math.PI);
        } else {
          point = previous;
        }
        failure = "Rollback · insufficient speed";
      } else if (point.load > 4 || point.load < -1) {
        failure = point.load > 4 ? "Ride stopped · above 4 g" : "Ride stopped · below −1 g";
      }
      const length = previous ? Math.hypot(point.x - previous.x, point.h - previous.h) : 0;
      point.distance = (previous?.distance ?? 0) + length;
      point.time = (previous?.time ?? 0) + 2 * length / Math.max(0.08, point.speed + (previous?.speed ?? 0));
      points.push(point);
      if (failure) break;
    }
  }
  return {points, failure, end: points.at(-1)};
}

function line(ctx, points, color, width = 1) {
  if (!points.length) return;
  ctx.beginPath();
  ctx.moveTo(...points[0]);
  for (const point of points.slice(1)) ctx.lineTo(...point);
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.stroke();
}

function crossing() {
  const sky = scene.createLinearGradient(0, 0, 0, 480);
  sky.addColorStop(0, "#101329");
  sky.addColorStop(.73, "#372342");
  sky.addColorStop(1, "#100e1c");
  scene.fillStyle = sky;
  scene.fillRect(0, 0, 1000, 480);
  for (let i = 0; i < 17; i++) {
    const x = i * 62;
    const top = 245 - (i * 53 % 105);
    scene.fillStyle = i % 2 ? "#17182d" : "#1e1932";
    scene.fillRect(x, top, 56, 350 - top);
    for (let y = top + 14; y < 331; y += 20) {
      scene.fillStyle = (i + y) % 3 ? "#4b496a" : "#896080";
      scene.fillRect(x + 8, y, 10, 3);
      scene.fillRect(x + 28, y, 17, 3);
    }
  }
  scene.fillStyle = "#191626";
  scene.fillRect(0, 350, 1000, 130);
  for (const direction of [-1, 1]) {
    for (let i = 0; i < 14; i++) {
      const x = 490 + i * 28 * direction;
      line(scene, [[x, 356 + i * 4], [x + direction * 17, 383 + i * 5]], "#9a8aa9", 6);
    }
  }
  for (const [x,y,w,label,color] of [[28,289,122,"SHIBUYA","#79e9fa"],[800,265,164,"ナイトクロス","#ff6aae"]]) {
    scene.fillStyle = "#20182d";
    scene.fillRect(x,y,w,35);
    scene.strokeStyle = color;
    scene.strokeRect(x,y,w,35);
    scene.font = "bold 20px system-ui";
    scene.fillStyle = color;
    scene.fillText(label,x+10,y+25);
    const reflection = scene.createLinearGradient(0, 352, 0, 478);
    reflection.addColorStop(0, color + "00");
    reflection.addColorStop(.4, color + "36");
    reflection.addColorStop(1, color + "00");
    scene.fillStyle = reflection;
    scene.fillRect(x+12,352,w-24,126);
  }
}

function renderTrack() {
  crossing();
  scene.font = "15px system-ui";
  for (const elevation of [20,40,60]) {
    line(scene, [[43,yPixel(elevation)],[955,yPixel(elevation)]], "#aea1d145");
    scene.fillStyle = "#ede1ff";
    scene.fillText(elevation + " m", 48, yPixel(elevation) - 9);
  }
  const curve = [];
  for (let segment = 0; segment < heights.length - 1; segment++) {
    for (let step = 0; step <= 90; step++) {
      const point = sample(segment, step / 90);
      curve.push([xPixel(point.x), yPixel(point.h)]);
    }
  }
  line(scene, curve, "#080913", 13);
  line(scene, curve, "#79e9fa", 6);
  heights.forEach((h,i) => {
    const x = xPixel(i * span);
    const y = yPixel(h);
    scene.beginPath();
    scene.arc(x,y,selected === i ? 10 : 8,0,2*Math.PI);
    scene.fillStyle = selected === i ? "#ff6aae" : "#141120";
    scene.fill();
    scene.strokeStyle = "#f7f1ff";
    scene.lineWidth = 2;
    scene.stroke();
  });
  if (profile.failure) {
    const {x,h} = profile.end;
    scene.font = "bold 24px system-ui";
    scene.fillStyle = "#ffd081";
    scene.fillText("⚠", Math.min(933,xPixel(x)+10), yPixel(h)-13);
  }
  scene.save();
  scene.translate(xPixel(current.x),yPixel(current.h));
  scene.rotate(Math.atan(-current.slope * 3.9 / 3.04));
  scene.fillStyle = "#ff6aae";
  scene.fillRect(-19,-13,38,10);
  scene.fillStyle = "#f7f1ff";
  scene.fillRect(-12,-18,20,6);
  scene.fillStyle = "#12111d";
  for (const wheel of [-12,12]) {
    scene.beginPath();
    scene.arc(wheel,-3,4,0,2*Math.PI);
    scene.fill();
  }
  scene.restore();
}

function resetRide(message = "Ready") {
  cancelAnimationFrame(frame);
  frame = 0;
  profile = analyze();
  current = profile.points[0];
  byId("ride").textContent = "Start ride";
  byId("status").textContent = message;
  showReadings();
  renderTelemetry();
  renderTrack();
}

function moveHandle(index,height) {
  selected = index;
  heights[index] = Math.round(Math.max(5,Math.min(75,height)));
  resetRide("Handle " + (index + 1) + " · " + heights[index] + " m");
}

function pointer(event) {
  const bounds = track.getBoundingClientRect();
  return {x: (event.clientX - bounds.left) * 1000 / bounds.width,
          y: (event.clientY - bounds.top) * 480 / bounds.height};
}

track.addEventListener("pointerdown", event => {
  const {x,y} = pointer(event);
  const index = Math.round((x-44)/(span*3.04));
  if (index < 0 || index >= heights.length) return;
  const tolerance = Math.max(21, 23000 / track.clientWidth);
  if (Math.hypot(x-xPixel(index*span),y-yPixel(heights[index])) > tolerance) return;
  selected = index;
  dragged = true;
  track.setPointerCapture(event.pointerId);
  resetRide();
});
track.addEventListener("pointermove", event => {
  if (dragged) moveHandle(selected,(345-pointer(event).y)/3.9);
});
track.addEventListener("lostpointercapture", () => { dragged = false; });
track.addEventListener("keydown", event => {
  if (/^[1-6]$/.test(event.key)) {
    moveHandle(Number(event.key)-1,heights[Number(event.key)-1]);
  } else if (event.key === "ArrowUp" || event.key === "ArrowDown") {
    event.preventDefault();
    moveHandle(selected, heights[selected] + (event.key === "ArrowUp" ? 1 : -1));
  }
});

function loadPreset() {
  heights = [...presets[byId("preset").value]];
  selected = 0;
  resetRide();
}
byId("preset").addEventListener("change", loadPreset);
byId("reset").addEventListener("click", loadPreset);
function renderTelemetry() {
  const {points,end} = profile;
  const total = heights.slice(1).reduce((sum,height,i) => {
    for (let j = 1; j <= 90; j++) {
      const a = sample(i,(j-1)/90);
      const b = sample(i,j/90);
      sum += Math.hypot(b.h-a.h,b.x-a.x);
    }
    return sum;
  },0);
  const mphMax = Math.max(20, Math.ceil(Math.max(...points.map(p => p.speed*2.23694))/20)*20);
  const x = distance => 63 + 874 * distance / total;
  const speedY = mph => 245 - 211 * mph / mphMax;
  const loadY = load => 245 - 211 * (load+2)/7;
  plot.clearRect(0,0,1000,300);
  plot.font = "19px system-ui";
  for (let i = 0; i <= 5; i++) {
    const d = Math.round(i*total/5);
    const y = speedY(i*mphMax/5);
    line(plot,[[63,y],[937,y]],"#39304c");
    plot.fillStyle = "#79e9fa";
    plot.fillText((i*mphMax/5).toFixed(0),16,y+6);
    plot.fillStyle = "#bdb0cf";
    plot.fillText(d+" m",x(d)-17,275);
  }
  for (const load of [-2,-1,0,1,2,3,4,5]) {
    plot.fillStyle = "#ff6aae";
    plot.fillText(String(load),951,loadY(load)+6);
  }
  plot.setLineDash([7,6]);
  for (const limit of [-1,4]) line(plot,[[63,loadY(limit)],[937,loadY(limit)]],"#ffd081");
  plot.setLineDash([]);
  line(plot,points.map(p => [x(p.distance),speedY(p.speed*2.23694)]),"#79e9fa",3);
  line(plot,points.map(p => [x(p.distance),loadY(p.load)]),"#ff6aae",3);
  if (profile.failure) line(plot,[[x(end.distance),30],[x(end.distance),245]],"#ffd081",2);
  const valley = heights[0] > heights[1] && heights[2] > heights[1] &&
    points.find(p => p.x === span);
  byId("valley").textContent = valley
    ? "First valley · " + (valley.speed*2.23694).toFixed(2) + " mph · " + valley.load.toFixed(3) + " g (arrival)"
    : "";
}

function showReadings() {
  byId("speed").textContent = (current.speed*2.23694).toFixed(1) + " mph";
  byId("load").textContent = current.load.toFixed(2) + " g";
  byId("distance").textContent = current.distance.toFixed(1) + " m";
}

function ride() {
  if (frame) {
    resetRide("Ride reset");
    return;
  }
  const start = performance.now();
  const rollback = profile.failure?.startsWith("Rollback");
  const {points,end} = profile;
  const reverseTime = rollback ? Math.min(2.2,end.time) : 0;
  byId("ride").textContent = "Stop ride";
  byId("status").textContent = "On track";
  function tick(now) {
    const elapsed = (now-start)/1000;
    const time = elapsed <= end.time ? elapsed : Math.max(0,end.time-(elapsed-end.time));
    let left = 0;
    let right = points.length-1;
    while (left < right) {
      const middle = Math.floor((left+right)/2);
      if (points[middle].time < time) left = middle+1;
      else right = middle;
    }
    current = points[left];
    if (elapsed >= end.time) {
      byId("status").textContent = profile.failure ?? "Ride complete";
      if (elapsed >= end.time+reverseTime) {
        frame = 0;
        byId("ride").textContent = "Start ride";
      }
    }
    showReadings();
    renderTrack();
    if (frame) frame = requestAnimationFrame(tick);
  }
  frame = requestAnimationFrame(tick);
}
byId("ride").addEventListener("click",ride);
loadPreset();
</script>
</body>
</html>
